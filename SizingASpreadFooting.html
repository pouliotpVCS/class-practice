<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spread Footing Design</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #673ab7; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: grid; grid-template-columns: 450px 1fr; height: 100vh; background: var(--bg); }
        .calc-sidebar { background: #212529; border-right: 2px solid #444; height: 100vh; position: sticky; top: 0; }
        iframe { width: 100%; height: 100%; border: none; filter: invert(0.9) hue-rotate(180deg); }
        .main-content { padding: 30px; overflow-y: auto; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; }
        .step { background: white; border: 1px solid #ddd; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .formula-box { background: #f0f0f0; padding: 15px; border-left: 4px solid var(--primary); margin: 10px 0; font-size: 1.1em; }
        .visual-container { background: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid #ddd; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 150px; }
        button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .param { font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>
    <div class="calc-sidebar"><iframe src="https://www.desmos.com/scientific"></iframe></div>
    <div class="main-content">
        <div class="header-flex">
            <a href="index.html" class="btn-back">← Back</a>
            <h1 style="margin:0;">Spread Footing Analysis</h1>
            <div id="scoreDisplay" style="font-weight:bold; background:var(--primary); color:white; padding:5px 15px; border-radius:20px;">Correct: 0</div>
        </div>
        <div class="visual-container">
            <div style="font-weight:bold; margin-bottom:10px;">FOOTING CROSS-SECTION</div>
            <svg width="300" height="180" viewBox="0 0 300 200">
                <line x1="0" y1="50" x2="300" y2="50" stroke="#8d6e63" stroke-width="2" stroke-dasharray="5,5" />
                <rect x="135" y="20" width="30" height="100" fill="#bdbdbd" stroke="#444" />
                <rect x="75" y="120" width="150" height="40" fill="#9e9e9e" stroke="#444" />
                <text x="10" y="45" font-size="12" fill="#8d6e63">Ground Level</text>
                <text x="230" y="145" font-size="12">Thick (T)</text>
                <text x="150" y="180" font-size="14" font-weight="bold" text-anchor="middle">Existing Area (A)</text>
            </svg>
        </div>
        <div class="step">
            <p><strong>Parameters:</strong> Load (P): <span class="param" id="dispP"></span> | Soil (q_all): <span class="param" id="dispQa"></span> | Area (A): <span class="param" id="dispA"></span> | Thick (T): <span class="param" id="dispT"></span></p>
        </div>
        <div id="step1" class="step">
            <h3>1. Calculate Net Allowable Pressure ($q_{net}$)</h3>
            <div class="formula-box">$$ q_{net} = q_{all} - (T \cdot 150 \text{ psf}) $$</div>
            <input type="number" id="in1"> <button onclick="check1()">Verify</button>
        </div>
        <div id="step2" class="step" style="opacity:0.3; pointer-events:none;">
            <h3>2. Safety Check</h3>
            <div class="formula-box">$$ \text{Required Area} = \frac{P}{q_{net}} $$</div>
            <button onclick="checkFinal(true)" style="background:#2e7d32;">SAFE</button> <button onclick="checkFinal(false)" style="background:#c62828;">UNSAFE</button>
        </div>
    </div>
    <script>
        let p = {}; let score = parseInt(localStorage.getItem('score_footing')) || 0;
        function generate() {
            p.qa = [2000, 3000, 4000][Math.floor(Math.random() * 3)];
            p.load = Math.floor(Math.random() * 15000) + 10000;
            p.thick = 2; p.existArea = Math.floor(Math.random() * 10) + 5;
            p.qnet = p.qa - (p.thick * 150);
            p.isSafe = p.existArea >= (p.load / p.qnet);
            document.getElementById('dispP').innerText = p.load + " lb";
            document.getElementById('dispQa').innerText = p.qa + " psf";
            document.getElementById('dispA').innerText = p.existArea + " ft²";
            document.getElementById('dispT').innerText = p.thick + " ft";
            document.getElementById('scoreDisplay').innerText = "Correct: " + score;
            document.getElementById('step2').style.opacity = "0.3";
            document.getElementById('step2').style.pointerEvents = "none";
        }
        function check1() {
            if(Math.abs(parseFloat(document.getElementById('in1').value) - p.qnet) < 10) {
                document.getElementById('step2').style.opacity = "1";
                document.getElementById('step2').style.pointerEvents = "auto";
            } else { alert("Try again. Concrete weight = 150 psf per foot of thickness."); }
        }
        function checkFinal(choice) {
            if(choice === p.isSafe) { score++; localStorage.setItem('score_footing', score); generate(); }
            else { alert("Incorrect assessment. Check Required Area vs Existing Area."); }
        }
        window.onload = generate;
    </script>
</body>
</html>
