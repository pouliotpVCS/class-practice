<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam Statics Practice</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #1a3a5a; --accent: #d9480f; --bg: #f8f9fa; --card: #ffffff; --success: #2b8a3e; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: var(--bg); color: #212529; overflow: hidden; }
        .wrapper { display: grid; grid-template-columns: 1.2fr 1fr 450px; height: 100vh; gap: 15px; padding: 15px; box-sizing: border-box; }
        .work-area { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow-y: auto; position: relative; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 15px; padding-bottom: 10px; }
        h1 { font-size: 1.1em; color: var(--primary); margin: 0; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; }
        .score-pill { background: var(--accent); color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8em; }
        .step { border: 1px solid #e9ecef; padding: 12px; margin-bottom: 10px; border-radius: 8px; opacity: 0.3; pointer-events: none; transition: 0.3s; }
        .step.active { border: 2px solid var(--primary); background: #fff; opacity: 1; pointer-events: auto; }
        .formula-bar { background: #343a40; color: #00ffc3; padding: 10px; border-radius: 4px; margin: 8px 0; text-align: center; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        input { flex-grow: 1; padding: 8px; border: 1px solid #dee2e6; border-radius: 4px; }
        button { padding: 8px 12px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .feedback { margin-top: 8px; font-weight: bold; display: none; padding: 6px; border-radius: 4px; font-size: 0.8em; }
        .correct { background: #d3f9d8; color: #2b8a3e; }
        .incorrect { background: #fff5f5; color: #c92a2a; }
        iframe { width:100%; height:100%; border:none; filter: invert(0.9) hue-rotate(180deg); }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="work-area">
        <div class="header-flex">
            <a href="index.html" class="btn-back">← Back</a>
            <h1 id="scenarioTitle">Loading...</h1>
            <div class="score-pill" id="scoreDisplay">Mastery: 0 / 5</div>
        </div>
        <div id="step1" class="step active"><strong>1. Total Vertical Force</strong><div class="formula-bar">\[ \sum F_y \]</div><div class="input-row"><input type="number" id="in1"><button onclick="check1()">Verify</button></div><div id="fb1" class="feedback"></div></div>
        <div id="step2" class="step"><strong>2. Moments at A</strong><div class="formula-bar">\[ \sum M_A \]</div><div class="input-row"><input type="number" id="in2"><button onclick="check2()">Verify</button></div><div id="fb2" class="feedback"></div></div>
        <div id="step3" class="step"><strong>3. Reaction B</strong><div class="formula-bar">\[ R_{by} \]</div><div class="input-row"><input type="number" id="in3"><button onclick="check3()">Verify</button></div><div id="fb3" class="feedback"></div></div>
        <div id="step4" class="step"><strong>4. Reaction A</strong><div class="formula-bar">\[ R_{ay} \]</div><div class="input-row"><input type="number" id="in4"><button onclick="check4()">Submit</button></div><div id="fb4" class="feedback"></div></div>
    </div>
    <div style="background:white; border-radius:12px; padding:20px;">
        <svg width="100%" height="250" id="beamSvg"><rect x="10%" y="110" width="80%" height="12" fill="#495057" /><g id="dynamicLoads"></g></svg>
    </div>
    <div style="background:#212529; border-radius:12px; overflow:hidden;"><iframe src="https://www.desmos.com/scientific"></iframe></div>
</div>

<script>
    let p = {}; 
    // LOAD SCORE FROM STORAGE
    let score = parseInt(localStorage.getItem('score_beam')) || 0;

    function generate() {
        document.getElementById('scoreDisplay').innerText = `Mastery: ${score} / 5`;
        p.L = 20; p.w = 40; p.points = [{mag: 500, dist: 12}];
        p.totalFy = -((p.w * p.L) + 500); p.ma = -((p.w * p.L * 10) + (500 * 12));
        p.rby = Math.abs(p.ma / p.L); p.ray = Math.abs(p.totalFy) - p.rby;
        document.getElementById('scenarioTitle').innerText = "Level " + (score + 1);
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step1').classList.add('active');
    }

    function check1() { activate('step2', 'fb1'); }
    function check2() { activate('step3', 'fb2'); }
    function check3() { activate('step4', 'fb3'); }
    function check4() {
        score++;
        // SAVE SCORE TO STORAGE
        localStorage.setItem('score_beam', score);
        document.getElementById('scoreDisplay').innerText = `Mastery: ${score} / 5`;
        document.getElementById('fb4').className = "feedback correct";
        document.getElementById('fb4').style.display = "block";
        document.getElementById('fb4').innerText = "Correct! Progress Saved.";
        setTimeout(generate, 2000);
    }

    function activate(id, fbId) {
        document.getElementById(fbId).className = "feedback correct";
        document.getElementById(fbId).style.display = "block";
        document.getElementById(fbId).innerText = "Correct.";
        document.getElementById(id).classList.add('active');
    }

    window.onload = generate;
</script>
</body>
</html>
